<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechArtha - Mobile App Preview</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .device-mockup {
            position: relative;
            width: 390px; /* iPhone 14 width */
            height: 844px; /* iPhone 14 height */
            background-color: #000;
            border-radius: 50px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 10px #1f2937, 0 0 0 12px #374151;
            overflow: hidden;
            margin: 20px;
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: #000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 100;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #F8F9FB;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="info">
        <h3>📱 App Preview Mode</h3>
        <p>This simulates an iPhone 14 screen (390x844).<br>Use this to check alignments!</p>
        <p><small>Make sure Next.js is running on port 3001.</small></p>
    </div>
    
    <div class="device-mockup">
        <div class="notch"></div>
        <iframe src="http://localhost:3001" title="App Preview"></iframe>
    </div>
</body>
</html>
